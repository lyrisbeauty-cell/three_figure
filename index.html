<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开源模型小镇</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <aside id="panel">
      <header>
        <h1>开源模型小镇</h1>
        <p class="sub">three.js · Kenney CC0 模型</p>
        <button id="panel-toggle" aria-label="收起面板">–</button>
      </header>
      <div id="panel-body">
        <div id="groups"></div>
        <div class="row">
          <label><input type="checkbox" id="follow" checked /> 镜头跟随</label>
          <button id="reset">重置视角</button>
        </div>
        <div class="help">
          <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 方向键 移动人物，<kbd>空格</kbd> 跳跃</p>
          <p>点击地面：人物走过去 · 拖动：旋转视角 · 滚轮：缩放</p>
        </div>
        <footer>
          模型来自 <a href="https://kenney.nl" target="_blank" rel="noopener">Kenney</a>，CC0 协议
        </footer>
      </div>
    </aside>

    <div id="loading">
      <div class="bar"><span id="loading-fill"></span></div>
      <p id="loading-text">正在加载模型…</p>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
